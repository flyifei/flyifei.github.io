###########################################################
### Welcome to Beautiful Jekyll!
### 本文件为 flyifei.github.io（GitHub Pages 根站点 / User Site）的个性化配置。
### 已根据你的仓库情况填好 url / baseurl / 作者 / 社交链接等，
### 标有【改成你的】的位置请按实际情况替换。
###########################################################

############################
# --- Required options --- #
############################

# Name of website
title: Flyifei 的个人主页          # 【改成你的】网站名称，显示在标题栏

# Your name to show in the footer
author: Flyifei                      # 【改成你的】页脚显示的署名

###############################################
# --- List of links in the navigation bar --- #
###############################################

navbar-links:
  About Me: "aboutme"
  Resources:
    - Beautiful Jekyll: "https://beautifuljekyll.com"   # 不想要可删掉整行
    - Learn markdown: "https://www.markdowntutorial.com/"
  My GitHub: "https://github.com/flyifei"               # 已换成你的 GitHub 主页

################
# --- Logo --- #
################

# 把你的头像放到仓库 assets/img/ 目录，再把下面路径改成对应文件名
avatar: "/assets/img/avatar-icon.png"

round-avatar: true

#title-img: /path/to/image


#####################################
# --- Footer social media links --- #
#####################################

# 只保留你确实有的账号，没有的直接删行；想启用注释项就去掉行首的 #（缩进保持两个空格）
social-network-links:
  email: "someone@example.com"       # 【改成你的】真实邮箱
  rss: true
  github: flyifei                    # 已改成你的 GitHub 用户名
#  facebook: yourname
#  twitter: yourname
#  linkedin: yourname
#  youtube: "@yourname"
#  instagram: yourname

# If you want your website to generate an RSS feed, provide a description
rss-description: Flyifei 的个人博客

###########################
# --- General options --- #
###########################

# ===== 部署地址（最关键）=====
# flyifei.github.io 属于 GitHub Pages 根站点（User Site），路径就在 / 下
url: "https://flyifei.github.io"      # 站点真实域名
baseurl: ""                           # 根站点必须为空字符串，切勿写成 /flyifei.github.io

# Select which social network share links to show in posts
share-links-active:
  twitter: true
  facebook: true
  linkedin: true
  vk: false
  reddit: false

# How to display the link to your website in the footer
url-pretty: "flyifei.github.io"        # 页脚展示文字，已改成你的域名

# Add the website title to the title of every page
title-on-all-pages: true

# Excerpt word length
excerpt_length: 50

# Whether or not to show an excerpt for every blog post in the feed page
feed_show_excerpt: true

# Whether or not to show a list of tags below each post preview in the feed page
feed_show_tags: true

# Add a search button to the navbar
post_search: true

# Add a button in the footer to edit the current page. Only works if hosted on GitHub
edit_page_button: true

# Allow sub-menu items to be longer than the top-level menu
navbar-var-length: false

# The keywords to associate with your website, for SEO purposes
#keywords: "my,list,of,keywords"

######################################
# --- Colours / background image --- #
######################################

page-col: "#FFFFFF"
text-col: "#404040"
link-col: "#008AFF"
hover-col: "#0085A1"
navbar-col: "#EAEAEA"
navbar-text-col: "#404040"
navbar-border-col: "#DDDDDD"
footer-col: "#EAEAEA"
footer-text-col: "#777777"
footer-link-col: "#404040"
footer-hover-col: "#0085A1"

#navbar-img: "/assets/img/bgimage.png"
#footer-img: "/assets/img/bgimage.png"
#page-img: "/assets/img/bgimage.png"

#mobile-theme-col: "#0085A1"

#site-css:
#  - "/assets/css/custom-styles.css"

#site-js:
#  - "/assets/js/custom-script.js"

#################################
# --- Web Analytics Section --- #
#################################

#gtag: "G-XXXXXXXXXX"
#cloudflare_analytics: ""
#gtm: ""

# Google Universal Analytics ID -- deprecated since July 2023, use gtag above.
#google_analytics: "UA-XXXXXXXX-X"

####################
# --- Comments --- #
####################

# To use Disqus comments, fill in your Disqus shortname (NOT the userid)
#disqus: ""

################
# --- Misc --- #
################

# Ruby Date Format to show dates of posts
date_format: "%B %-d, %Y"

# Facebook App ID
#fb_app_id: ""

#################################################################################
# --- You don't need to touch anything below here (but you can if you want) --- #
#################################################################################

# Output options (more information on Jekyll's site)
timezone: "Asia/Shanghai"
markdown: kramdown
highlighter: rouge
permalink: /:year-:month-:day-:title/
paginate: 5

kramdown:
  input: GFM

# Default YAML values (more information on Jekyll's site)
defaults:
  -
    scope:
      path: ""
      type: "posts"
    values:
      layout: "post"
      comments: true
      social-share: true
  -
    scope:
      path: ""
    values:
      layout: "page"

# Exclude these files from production site
exclude:
  - CHANGELOG.md
  - CNAME
  - Gemfile
  - Gemfile.lock
  - LICENSE
  - README.md
  - screenshot.png
  - docs/

plugins:
  - jekyll-paginate
  - jekyll-sitemap

